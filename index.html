<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Warna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<style>
    #color_area {
        height: 400px;
        background-color: rgb(251, 251, 251);
    }
</style>

<body>
    <div class="container mt-4">
        <div class="row mb-3">
        </div>
        <div class="col" id="color_area">
        </div>
        <div class="row text-center mt-3">
            <div class="col d-grid">
                <button type="button" class="btn btn-danger" onclick="ubahWarna('red')">Merah</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-primary" onclick="ubahWarna('blue')">Biru</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-success" onclick="ubahWarna('green')">Hijau</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-warning" onclick="ubahWarna('yellow')">Kuning</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-secondary" onclick="ubahWarna('gray')">Abu-abu</button>
            </div>
        </div>
        <div class="alert alert-secondary text-center" role="alert">
            Danish Eshan H | 25/568772/SV/27529-PGWEB | Acara 3
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

        <script>

            function ubahWarna(warna) {
                document.getElementById("color_area").style.backgroundColor = warna;
            }
        </script>

</body>

</html>
